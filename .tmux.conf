# Make ZSH default shell
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# True color support (TokyoNight hex colors render exactly)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pass Shift+Enter and other modified keys to apps (Claude Code)
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let iTerm2 notifications and images pass through tmux
set -g allow-passthrough on

# Highlight windows that rang the bell (agent finished or waiting)
set -g monitor-bell on
set -g bell-action other

set -g display-time 3000
set -g remain-on-exit off

# Normal splitting over windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Copy and paste a bit like vim (y copies to macOS clipboard)
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# Do not show inline previews
bind-key s choose-tree -ZsN
bind-key w choose-tree -ZwN

# Swap window with the previous one
bind-key T swap-window -t -1 \; previous-window

# Allow Claude hooks to change title of the iterm2
set-option -g set-titles on

# Mouse disabled so iTerm2 handles text selection natively
set -g mouse off

# VIM key bindings
set -g mode-keys vi

# Quick jump to the next pane
bind -r k select-pane -t +1 \; resize-pane -Z

# Keep longer history (default 2k)
set -g history-limit 50000

# Start numering of windows and panes from 1 (as 0 is not in the good place in the keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Close gaps in window numbers after closing a window
set -g renumber-windows on

# Closing the last window of a session switches to another session instead of detaching
set -g detach-on-destroy off

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Quick resize to a percentage value
bind h run-shell "~/.tmux/scripts/resize-adaptable.sh -l main-horizontal -p 75"
bind v run-shell "~/.tmux/scripts/resize-adaptable.sh -l main-vertical -p 75"

# Repeatable pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Popups: revdiff of branch changes and scratch shell in the current directory
bind g display-popup -E -w 100% -h 100% -d "#{pane_current_path}" 'revdiff -o /tmp/revdiff-annotations.md $(git merge-base HEAD origin/main)'
bind v display-popup -E -w 100% -h 100% -d "#{pane_current_path}" 'nvim .'

# Fix autoread for VIM
set-option -g focus-events on

# TokyoNight colors for Tmux
# Source: https://github.com/folke/tokyonight.nvim/blob/main/extras/tmux/tokyonight_moon.tmux

set -g mode-style "fg=#82aaff,bg=#3b4261"

set -g message-style "fg=#82aaff,bg=#3b4261"
set -g message-command-style "fg=#82aaff,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#82aaff,bg=#1e2030"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1b1d2b,bg=#82aaff,bold] #S #[fg=#82aaff,bg=#1e2030,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#1e2030] #{prefix_highlight} #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261] %Y-%m-%d %I:%M %p #[fg=#82aaff,bg=#3b4261,nobold,nounderscore,noitalics]"
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#1e2030] #{prefix_highlight} #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261] %Y-%m-%d %H:%M #[fg=#82aaff,bg=#3b4261,nobold,nounderscore,noitalics]"
}

setw -g window-status-activity-style "underscore,fg=#828bb8,bg=#1e2030"
setw -g window-status-bell-style "fg=#1e2030,bg=#ffc777,bold"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#828bb8,bg=#1e2030"
setw -g window-status-format "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[default] [#I] #W #[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261,bold] [#I] #W #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#ffc777]#[bg=#1e2030]#[fg=#1e2030]#[bg=#ffc777]"
set -g @prefix_highlight_output_suffix ""

# Notification plugin settings
set -g @tnotify-verbose 'on'
set -g @tnotify-verbose-msg 'Completed in #S:#W'
set -g @tnotify-verbose-title 'Tmux'
set -g @tnotify-custom-cmd 'afplay /System/Library/Sounds/Funk.aiff -v 1'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'rickstaa/tmux-notify'
run '~/.tmux/plugins/tpm/tpm'

# Notification plugin bindings (after tpm so they override plugin defaults)
unbind-key m
unbind-key M
bind-key m run-shell -b "~/.tmux/plugins/tmux-notify/scripts/notify.sh true"
bind-key M run-shell -b "~/.tmux/plugins/tmux-notify/scripts/notify.sh true"
